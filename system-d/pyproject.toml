[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system-d"
version = "0.1.0"
description = "A simulated public-opinion polling system for political claims"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary,pool]>=3.1",
    "pgvector",
    "pydantic>=2",
    "httpx",
    "scipy",
    "numpy",
    "modal>=1.0,<1.7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["system_d*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
